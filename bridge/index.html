<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 핵심: 성인 사이트 리퍼러 출처를 100% 삭제하여 AdMob 계정 영구 보호 -->
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Connecting to Google Play Store...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 20px; max-width: 400px; width: 100%; padding: 36px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .spinner { width: 44px; height: 44px; border: 4px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 19px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #2563eb; color: #fff; text-decoration: none; padding: 13px 24px; border-radius: 12px; font-size: 14px; font-weight: 700; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 id="title">Google Play Store로 이동 중...</h2>
    <p id="desc">잠시만 기다려주세요. 공식 앱 스토어로 안전하게 연결합니다.</p>
    <a id="target-link" href="https://play.google.com/store/apps/details?id=com.deepflow_dev.OO_Video_Downloader" rel="noreferrer noopener" class="btn">
      <span id="btn-text">직접 이동하기 (Click here)</span>
    </a>
  </div>

  <script>
    // 1. 방문자 브라우저 언어 자동 감지 (12개국 지원)
    const urlParams = new URLSearchParams(window.location.search);
    const lang = (urlParams.get('lang') || navigator.language.slice(0, 2)).toLowerCase();

    const TEXTS = {
      ko: { title: "Google Play Store로 이동 중...", desc: "잠시만 기다려주세요. 안전하게 연결합니다.", btn: "직접 이동하기" },
      en: { title: "Redirecting to Google Play...", desc: "Please wait a moment. Connecting safely.", btn: "Click here to open" },
      ja: { title: "Google Play へ移動中...", desc: "少々お待ちください。安全に接続しています。", btn: "今すぐ開く" },
      es: { title: "Redirigiendo a Google Play...", desc: "Por favor espere. Conectando de forma segura.", btn: "Abrir ahora" },
      pt: { title: "Redirecionando ao Google Play...", desc: "Aguarde um momento. Conectando com segurança.", btn: "Abrir agora" },
      id: { title: "Mengarahkan ke Google Play...", desc: "Mohon tunggu sebentar. Menghubungkan dengan aman.", btn: "Buka Sekarang" },
      hi: { title: "Google Play पर भेजा जा रहा है...", desc: "कृपया प्रतीक्षा करें। सुरक्षित रूप से कनेक्ट हो रहा है।", btn: "अभी खोलें" },
      de: { title: "Weiterleitung zum Google Play Store...", desc: "Bitte warten. Sichere Verbindung wird hergestellt.", btn: "Jetzt öffnen" },
      fr: { title: "Redirection vers Google Play...", desc: "Veuillez patienter. Connexion sécurisée en cours.", btn: "Ouvrir" },
      ru: { title: "Переход в Google Play Store...", desc: "Пожалуйста, подождите. Безопасное подключение.", btn: "Открыть" },
      vi: { title: "Đang chuyển đến Google Play...", desc: "Vui lòng đợi giây lát. Đang kết nối an toàn.", btn: "Mở ngay" },
      ar: { title: "جارٍ التحويل إلى Google Play...", desc: "يرجى الانتظار لحظة. يتم الاتصال بأمان.", btn: "افتح الآن" }
    };
    const t = TEXTS[lang] || TEXTS['en'];
    if (lang === 'ar') { document.body.dir = 'rtl'; }
    document.getElementById('title').innerText = t.title;
    document.getElementById('desc').innerText = t.desc;
    document.getElementById('btn-text').innerText = t.btn;

    // 2. 리퍼러가 삭제된 플레이스토어 최종 주소
    const playStoreUrl = "https://play.google.com/store/apps/details?id=com.deepflow_dev.OO_Video_Downloader&hl=" + lang;
    document.getElementById('target-link').href = playStoreUrl;

    // 3. 브라우저 리퍼러 세탁 정책 로드 완료 직후(0.1초) 자동 즉시 이동!
    setTimeout(function() {
      window.location.replace(playStoreUrl);
    }, 100);
  </script>
</body>
</html>
