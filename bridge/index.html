<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- 핵심: 성인 사이트 리퍼러를 100% 삭제하여 AdMob 계정 완벽 보호 -->
  <meta name="referrer" content="no-referrer">
  <title>Google Play</title>
  <script>
    // 1. 유저 국가 언어 감지 (?lang=ko 등)
    var p = new URLSearchParams(window.location.search);
    var l = (p.get('lang') || navigator.language.slice(0, 2)).toLowerCase();
    var targetUrl = "https://play.google.com/store/apps/details?id=com.deepflow_dev.OO_Video_Downloader&hl=" + l;
    
    // 2. 화면이 그려지기도 전에 0초 만에 플레이스토어로 즉시 다이렉트 점프!
    window.location.replace(targetUrl);
  </script>
  <!-- 구형 브라우저 백업용 0초 점프 -->
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.deepflow_dev.OO_Video_Downloader">
</head>
<body style="background:#ffffff;margin:0;padding:0;">
</body>
</html>
